services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pac_progress}
      POSTGRES_USER: ${POSTGRES_USER:-pac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pac_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pac} -d ${POSTGRES_DB:-pac_progress}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    image: ghcr.io/pressly/goose:v3.22.1
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-pac}:${POSTGRES_PASSWORD:-pac_dev_only}@db:5432/${POSTGRES_DB:-pac_progress}?sslmode=disable
    volumes:
      - ./server/migrations:/migrations:ro
    command: ["-dir", "/migrations", "up"]
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pac}:${POSTGRES_PASSWORD:-pac_dev_only}@db:5432/${POSTGRES_DB:-pac_progress}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me-now}
      UPLOAD_DIR: /data/uploads
      APP_ADDR: :8080
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
volumes:
  postgres_data:
  uploads:

